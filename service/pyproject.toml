[project]
name = "amt-rest-service"
version = "0.1.0"
description = "FastAPI REST adapter for Azure Cosmos Agent Memory Toolkit"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "azure-cosmos-agent-memory",
    "pydantic>=2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
