[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_memory_mcp*"]

[project]
name = "azure-cosmos-agent-memory-mcp"
version = "0.1.0b1"
description = "Model Context Protocol (MCP) server exposing the Azure Cosmos DB Agent Memory Toolkit to AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Microsoft Corporation", email = "azurecosmosdb@microsoft.com"},
]
keywords = [
    "azure",
    "cosmos",
    "cosmosdb",
    "agent",
    "memory",
    "mcp",
    "model-context-protocol",
    "llm",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "azure-cosmos-agent-memory>=0.2.0b3",
    "mcp>=1.12",
    "pydantic>=2.10",
    "pydantic-settings>=2.0",
    "azure-identity>=1.20",
]

[project.optional-dependencies]
auth = [
    "pyjwt[crypto]>=2.8",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.8",
    "ruff>=0.4",
]

[project.scripts]
agent-memory-mcp = "agent_memory_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/AzureCosmosDB/AgentMemoryToolkit"
Repository = "https://github.com/AzureCosmosDB/AgentMemoryToolkit"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "integration: requires live Azure services",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
